name: OSD Core and DirectWrite Smoke
on:
  push:
    branches:
      - work/osd-directwrite-integration-map
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DVHS90_BUILD_TESTS=ON -DVHS90_BUILD_AE_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
