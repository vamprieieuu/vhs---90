name: VHS-90 Windows AEX Build

on:
  workflow_dispatch:
    inputs:
      vhs_archive_url:
        description: "Optional downloadable URL for the original vhs.zip (SDK + fonts). Leave blank when vhs.zip is in the repository root."
        required: false
        type: string
permissions:
  contents: write

jobs:
  build-aex:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain the original VHS6RIFT archive
        shell: pwsh
        env:
          VHS_ARCHIVE_URL: ${{ inputs.vhs_archive_url }}
        run: |
          if (-not (Test-Path 'vhs.zip') -and -not [string]::IsNullOrWhiteSpace($env:VHS_ARCHIVE_URL)) {
            Invoke-WebRequest -Uri $env:VHS_ARCHIVE_URL -OutFile 'vhs.zip'
          }
          if (-not (Test-Path 'vhs.zip')) {
            throw 'The original vhs.zip is required. Add it to the workspace or supply a downloadable URL as the workflow input. build.ps1 extracts the VHS6RIFT SDK and the two OFL font files from this archive.'
          }
          Write-Host "VHS archive size: $((Get-Item 'vhs.zip').Length) bytes"

      - name: Configure, build and test
        shell: pwsh
        run: .\\build.ps1 -VhsArchivePath "$env:GITHUB_WORKSPACE\\vhs.zip" -BuildDir build -Configuration Release

      - name: Verify single-file output
        shell: pwsh
        run: |
          $aex = Join-Path $env:GITHUB_WORKSPACE 'build\\VHS-90.aex'
          if (-not (Test-Path $aex)) { throw "Missing root-level AEX: $aex" }
          $item = Get-Item $aex
          if ($item.Length -lt 65536) { throw "AEX is unexpectedly small ($($item.Length) bytes)." }
          Write-Host "AEX_READY=$($item.FullName)"
          Write-Host "AEX_SIZE=$($item.Length)"

      - name: Upload bare AEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VHS-90-AEX
          path: build/VHS-90.aex
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct AEX download
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vhs90-aex-$($env:GITHUB_SHA.Substring(0,12))"
          gh release create $tag build/VHS-90.aex --repo "${{ github.repository }}" --title "VHS-90 AEX $($env:GITHUB_SHA.Substring(0,12))" --notes "Windows x64 / MSVC 2022 build from commit $env:GITHUB_SHA. Validate in After Effects before production use."
